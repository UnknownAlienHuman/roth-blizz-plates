name: Temporary full validation

on:
  push:
    branches:
      - fix/exact-hook-font-object-restore-2026-11-07

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Lua runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4

      - name: Parse WoW runtime with Lua 5.1
        run: |
          luac5.1 -p core.lua
          luac5.1 -p castbar_12_1.lua

      - name: Run all Lua regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.lua; do
            echo "==> $test"
            lua5.4 "$test" .
          done

      - name: Run static policy checks
        run: python3 tests/static_check.py
