name: Retail 12.1 static validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Parse runtime and regression files
        run: |
          luac5.1 -p core.lua
          luac5.1 -p castbar_12_1.lua
          luac5.1 -p tests/test_combat_deferral.lua

      - name: Run combat-deferral regression
        run: lua5.1 tests/test_combat_deferral.lua

      - name: Enforce 12.1 presentation boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [Path('core.lua'), Path('castbar_12_1.lua')]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          forbidden = [
              'GetChildren(',
              'GetNumChildren(',
              'HookScript(',
              'UnitName(',
              'UnitGUID(',
              'UnitHealth(',
              'C_UnitAuras',
              'AuraUtil.ForEachAura',
          ]
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'Forbidden runtime patterns: {found}')

          toc = Path('RothBlizzPlates.toc').read_text(encoding='utf-8')
          assert '## Interface: 120100' in toc
          assert 'castbar_12_1.lua' in toc
          assert '\ncastbar.lua\n' not in f'\n{toc}\n'
          print('Static policy: PASS')
          PY
